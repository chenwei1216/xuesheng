<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行星身份迷宫 - 关卡挑战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0c1445, #1a237e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            padding: 20px;
        }

        .game-container {
            max-width: 900px;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            margin-top: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            color: #00d4ff;
            text-shadow: 0 0 10px #00d4ff;
            flex: 1;
        }

        .level-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #ffeb3b;
        }

        .instructions {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 16px;
            line-height: 1.5;
        }

        .level-progress {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .level-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #00d4ff;
            background: rgba(15, 66, 135, 0.5);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .level-btn.active {
            background: #00d4ff;
            color: #0c1445;
            transform: scale(1.1);
        }

        .level-btn.locked {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #666;
        }

        .maze-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .feature-card, .planet-card {
            background: linear-gradient(45deg, #1565c0, #0d47a1);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            cursor: grab;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .feature-card:hover, .planet-card:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        .feature-card.dragging, .planet-card.dragging {
            opacity: 0.7;
            cursor: grabbing;
        }

        .matched {
            border-color: #4caf50;
            background: linear-gradient(45deg, #2e7d32, #1b5e20);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #00d4ff;
            color: #0c1445;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #00a8cc;
            transform: translateY(-2px);
        }

        #feedback {
            height: 40px;
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            color: #ffeb3b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .next-level-btn {
            background: #4caf50;
            margin-left: 10px;
            display: none;
        }

        .next-level-btn:hover {
            background: #388e3c;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .maze-grid {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>行星身份迷宫 - 关卡挑战</h1>
            <div class="level-info">当前关卡：<span id="current-level">1</span>/3</div>
        </div>
        
        <div class="instructions">
            <strong>游戏规则：</strong>将左侧的行星特征卡片拖动到右侧对应的行星卡片上，完成所有正确匹配即可通关当前关卡！<br>
            提示：匹配正确的卡片会显示绿色边框，完成当前关卡后可解锁下一关，全部关卡完成即为通关！
        </div>

        <!-- 关卡选择 -->
        <div class="level-progress">
            <button class="level-btn active" data-level="1">1</button>
            <button class="level-btn locked" data-level="2">2</button>
            <button class="level-btn locked" data-level="3">3</button>
        </div>

        <div class="maze-grid">
            <div id="feature-cards">
                <!-- 特征卡片会由JS动态生成 -->
            </div>
            <div id="planet-cards">
                <!-- 行星卡片会由JS动态生成 -->
            </div>
        </div>

        <div id="feedback">
            <span id="feedback-text">准备开始第一关挑战！</span>
            <button class="next-level-btn" id="next-level-btn">下一关</button>
        </div>

        <div class="controls">
            <button id="reset-btn">重置当前关卡</button>
            <button id="hint-btn">获取提示</button>
        </div>
    </div>

    <script>
        // 多关卡行星数据 - 总共3个关卡，难度递增
        const levelData = {
            1: [
                { planet: "木星", feature: "太阳系中最大的行星" },
                { planet: "火星", feature: "表面干旱，被称为红色星球" },
                { planet: "地球", feature: "存在液态水和生命的行星" },
                { planet: "天王星", feature: "表面有冰封特征的气态行星" },
                { planet: "水星", feature: "距离太阳最近的行星" }
            ],
            2: [
                { planet: "土星", feature: "拥有明显行星环的气态巨行星" },
                { planet: "金星", feature: "太阳系中最热的行星" },
                { planet: "海王星", feature: "太阳系中最远的行星" },
                { planet: "冥王星", feature: "被归类为矮行星的天体" },
                { planet: "月球", feature: "地球唯一的天然卫星" }
            ],
            3: [
                { planet: "木星", feature: "拥有超过95颗已知卫星" },
                { planet: "土星", feature: "密度比水还小的行星" },
                { planet: "火星", feature: "拥有奥林匹斯山（太阳系最高火山）" },
                { planet: "金星", feature: "自转方向与其他行星相反" },
                { planet: "天王星", feature: "自转轴几乎与公转平面平行" },
                { planet: "海王星", feature: "拥有太阳系最强风暴（大暗斑）" },
                { planet: "水星", feature: "几乎没有大气层的行星" }
            ]
        };

        // 全局变量
        let currentLevel = 1;
        let unlockedLevels = 1; // 记录已解锁的关卡
        const maxLevels = Object.keys(levelData).length;

        // DOM元素获取
        const featureCardsContainer = document.getElementById('feature-cards');
        const planetCardsContainer = document.getElementById('planet-cards');
        const feedbackText = document.getElementById('feedback-text');
        const feedbackContainer = document.getElementById('feedback');
        const nextLevelBtn = document.getElementById('next-level-btn');
        const resetBtn = document.getElementById('reset-btn');
        const hintBtn = document.getElementById('hint-btn');
        const levelButtons = document.querySelectorAll('.level-btn');
        const currentLevelDisplay = document.getElementById('current-level');
        let draggedFeature = null;

        // 生成打乱顺序的数组
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // 初始化指定关卡
        function initGame(level) {
            // 更新当前关卡信息
            currentLevel = level;
            currentLevelDisplay.textContent = currentLevel;
            
            // 重置UI状态
            featureCardsContainer.innerHTML = '';
            planetCardsContainer.innerHTML = '';
            feedbackText.textContent = `第${level}关：将特征卡片拖到对应行星卡片上`;
            feedbackText.style.color = '#ffeb3b';
            nextLevelBtn.style.display = 'none';
            
            // 更新关卡按钮状态
            levelButtons.forEach(btn => {
                const btnLevel = parseInt(btn.dataset.level);
                btn.classList.remove('active');
                if (btnLevel === currentLevel) {
                    btn.classList.add('active');
                }
            });

            // 获取当前关卡数据
            const planetData = levelData[level];
            
            // 打乱特征和行星顺序
            const shuffledFeatures = shuffleArray(planetData.map(item => item.feature));
            const shuffledPlanets = shuffleArray(planetData.map(item => item.planet));

            // 创建特征卡片
            shuffledFeatures.forEach(feature => {
                const card = document.createElement('div');
                card.className = 'feature-card';
                card.draggable = true;
                card.textContent = feature;
                card.dataset.feature = feature;
                card.addEventListener('dragstart', handleDragStart);
                featureCardsContainer.appendChild(card);
            });

            // 创建行星卡片
            shuffledPlanets.forEach(planet => {
                const card = document.createElement('div');
                card.className = 'planet-card';
                card.textContent = planet;
                card.dataset.planet = planet;
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('drop', handleDrop);
                planetCardsContainer.appendChild(card);
            });
        }

        // 拖拽相关事件处理
        function handleDragStart(e) {
            draggedFeature = this;
            e.dataTransfer.setData('text/plain', this.dataset.feature);
            setTimeout(() => {
                this.classList.add('dragging');
            }, 0);
        }

        function handleDragOver(e) {
            e.preventDefault(); // 允许放置
            this.classList.add('dragging');
        }

        function handleDrop(e) {
            e.preventDefault();
            const feature = e.dataTransfer.getData('text/plain');
            const planet = this.dataset.planet;
            
            // 移除所有拖拽状态
            document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));

            // 检查是否匹配
            const planetData = levelData[currentLevel];
            const isMatch = planetData.some(item => item.feature === feature && item.planet === planet);
            
            if (isMatch) {
                // 标记匹配成功
                draggedFeature.classList.add('matched');
                this.classList.add('matched');
                feedbackText.textContent = '匹配正确！🎉';
                feedbackText.style.color = '#4caf50';
                
                // 禁用已匹配的卡片
                draggedFeature.draggable = false;
                this.removeEventListener('dragover', handleDragOver);
                this.removeEventListener('drop', handleDrop);

                // 检查是否全部匹配完成
                checkLevelComplete();
            } else {
                feedbackText.textContent = '匹配错误，请重试！❌';
                feedbackText.style.color = '#f44336';
            }
        }

        // 检查当前关卡是否完成
        function checkLevelComplete() {
            const planetData = levelData[currentLevel];
            const matchedFeatureCards = document.querySelectorAll('.feature-card.matched');
            const matchedPlanetCards = document.querySelectorAll('.planet-card.matched');
            
            if (matchedFeatureCards.length === planetData.length && matchedPlanetCards.length === planetData.length) {
                feedbackText.textContent = `恭喜！第${currentLevel}关通关成功！`;
                feedbackText.style.color = '#ffeb3b';
                
                // 如果不是最后一关，显示下一关按钮
                if (currentLevel < maxLevels) {
                    nextLevelBtn.style.display = 'inline-block';
                    
                    // 解锁下一关
                    unlockedLevels = Math.max(unlockedLevels, currentLevel + 1);
                    const nextLevelBtnElement = document.querySelector(`.level-btn[data-level="${currentLevel + 1}"]`);
                    if (nextLevelBtnElement) {
                        nextLevelBtnElement.classList.remove('locked');
                    }
                } else {
                    feedbackText.textContent = '🎉 恭喜你！所有关卡都已通关，你是行星小专家！';
                }
            }
        }

        // 获取提示
        function showHint() {
            const planetData = levelData[currentLevel];
            // 找到第一个未匹配的特征和对应的行星
            const unmatchedFeature = document.querySelector('.feature-card:not(.matched)');
            if (!unmatchedFeature) {
                feedbackText.textContent = '已经没有需要提示的匹配啦！';
                return;
            }

            const feature = unmatchedFeature.dataset.feature;
            const correctPlanet = planetData.find(item => item.feature === feature).planet;
            const planetCard = document.querySelector(`.planet-card[data-planet="${correctPlanet}"]`);

            // 高亮提示
            feedbackText.textContent = `提示：「${feature}」对应的是「${correctPlanet}」`;
            feedbackText.style.color = '#ffeb3b';
            
            // 闪烁提示卡片
            unmatchedFeature.style.animation = 'blink 1s ease 3';
            planetCard.style.animation = 'blink 1s ease 3';
            
            // 添加闪烁样式
            const style = document.createElement('style');
            style.textContent = `
                @keyframes blink {
                    0%, 100% { box-shadow: 0 0 15px rgba(0, 212, 255, 0.5); }
                    50% { box-shadow: 0 0 30px rgba(255, 235, 59, 0.8); }
                }
            `;
            document.head.appendChild(style);
            
            // 3秒后移除动画
            setTimeout(() => {
                unmatchedFeature.style.animation = '';
                planetCard.style.animation = '';
            }, 3000);
        }

        // 绑定事件
        // 重置按钮
        resetBtn.addEventListener('click', () => initGame(currentLevel));
        
        // 提示按钮
        hintBtn.addEventListener('click', showHint);
        
        // 下一关按钮
        nextLevelBtn.addEventListener('click', () => {
            if (currentLevel < maxLevels) {
                initGame(currentLevel + 1);
            }
        });
        
        // 关卡选择按钮
        levelButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const level = parseInt(btn.dataset.level);
                // 只允许切换到已解锁的关卡
                if (level <= unlockedLevels) {
                    initGame(level);
                } else {
                    feedbackText.textContent = `请先完成第${level-1}关解锁此关卡！`;
                    feedbackText.style.color = '#f44336';
                }
            });
        });

        // 初始化第一关
        initGame(1);
    </script>
</body>
</html>
