<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行星匹配战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, #fff, transparent),
                radial-gradient(1px 1px at 90px 40px, #ddd, transparent),
                radial-gradient(2px 2px at 160px 120px, #fff, transparent),
                radial-gradient(1px 1px at 230px 80px, #eee, transparent),
                radial-gradient(2px 2px at 300px 150px, #fff, transparent),
                radial-gradient(1px 1px at 350px 200px, #ddd, transparent),
                radial-gradient(2px 2px at 420px 50px, #fff, transparent),
                radial-gradient(1px 1px at 480px 280px, #eee, transparent),
                radial-gradient(2px 2px at 550px 100px, #fff, transparent);
            background-size: 600px 300px;
            animation: twinkle 5s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(78, 205, 196, 0.5);
            background: linear-gradient(90deg, #4ecdc4, #44a08d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1rem;
            color: #aaa;
            margin-bottom: 20px;
        }

        .game-info {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 25px;
            border-radius: 25px;
            border: 1px solid rgba(78, 205, 196, 0.3);
        }

        .info-item span {
            color: #4ecdc4;
            font-weight: bold;
        }

        .game-container {
            display: flex;
            gap: 40px;
            max-width: 900px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .column-title {
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #4ecdc4;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .planet-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            backdrop-filter: blur(10px);
        }

        .planet-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.2);
        }

        .planet-card.selected {
            border-color: #4ecdc4;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.5);
        }

        .planet-card.correct {
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.2);
            pointer-events: none;
        }

        .planet-card.hint {
            border-color: #f39c12;
            background: rgba(243, 156, 18, 0.2);
            animation: pulse 1s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.5);
        }

        .planet-card.hint.mercury {
            border-color: #e74c3c;
            background: rgba(231, 76, 60, 0.3);
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.6);
        }

        .planet-card.hint.venus {
            border-color: #f39c12;
            background: rgba(243, 156, 18, 0.3);
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.6);
        }

        .planet-card.hint.earth {
            border-color: #3498db;
            background: rgba(52, 152, 219, 0.3);
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.6);
        }

        .planet-card.hint.mars {
            border-color: #c0392b;
            background: rgba(192, 57, 43, 0.3);
            box-shadow: 0 0 15px rgba(192, 57, 43, 0.6);
        }

        .planet-card.hint.jupiter {
            border-color: #d68910;
            background: rgba(214, 137, 16, 0.3);
            box-shadow: 0 0 15px rgba(214, 137, 16, 0.6);
        }

        .planet-card.hint.saturn {
            border-color: #f1c40f;
            background: rgba(241, 196, 15, 0.3);
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.6);
        }

        .planet-card.hint.uranus {
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.3);
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
        }

        .planet-card.hint.neptune {
            border-color: #9b59b6;
            background: rgba(155, 89, 182, 0.3);
            box-shadow: 0 0 15px rgba(155, 89, 182, 0.6);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .planet-card.wrong {
            border-color: #e74c3c;
            background: rgba(231, 76, 60, 0.2);
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .planet-card .planet-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .planet-card .planet-name {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .message {
            margin-top: 20px;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.2rem;
            text-align: center;
            min-height: 50px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .message.show {
            opacity: 1;
        }

        .message.success {
            background: rgba(46, 204, 113, 0.3);
            border: 1px solid #2ecc71;
        }

        .message.error {
            background: rgba(231, 76, 60, 0.3);
            border: 1px solid #e74c3c;
        }

        .message.info {
            background: rgba(78, 205, 196, 0.3);
            border: 1px solid #4ecdc4;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-restart {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-edit {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }

        .btn-answer {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-answer:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(79, 172, 254, 0.4);
        }

        .edit-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(30, 30, 60, 0.98), rgba(20, 20, 50, 0.98));
            padding: 30px;
            border-radius: 20px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            z-index: 2000;
            display: none;
            border: 2px solid rgba(78, 205, 196, 0.5);
            box-shadow: 0 0 50px rgba(78, 205, 196, 0.3);
        }

        .edit-modal.show {
            display: block;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .edit-modal h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #4ecdc4;
        }

        .edit-item {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(78, 205, 196, 0.2);
        }

        .edit-item label {
            display: block;
            margin-bottom: 8px;
            color: #4ecdc4;
            font-weight: bold;
        }

        .edit-item input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(78, 205, 196, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .edit-item input[type="text"]:focus {
            outline: none;
            border-color: #4ecdc4;
            box-shadow: 0 0 10px rgba(78, 205, 196, 0.3);
        }

        .edit-item input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid rgba(78, 205, 196, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
        }

        .edit-item .preview {
            margin-top: 10px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(78, 205, 196, 0.3);
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        .btn-save {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: white;
            padding: 12px 40px;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(78, 205, 196, 0.4);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 40px;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .victory {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.95), rgba(39, 174, 96, 0.95));
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            z-index: 1000;
            display: none;
            animation: popIn 0.5s ease;
        }

        .victory h2 {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .victory p {
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }

            .column {
                width: 100%;
                max-width: 300px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .planet-card .planet-img {
                width: 60px;
                height: 60px;
            }

            .planet-card .planet-name {
                font-size: 1.1rem;
            }

            .edit-modal {
                padding: 20px;
                max-height: 85vh;
            }

            .modal-buttons {
                flex-direction: column;
            }

            .modal-buttons .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <h1>🪐 行星匹配战</h1>
    <p class="subtitle">点击行星图片，再点击对应名称，完成配对！</p>

    <div class="game-info">
        <div class="info-item">配对成功: <span id="score">0</span>/8</div>
        <div class="info-item">尝试次数: <span id="attempts">0</span></div>
    </div>

    <div class="game-container">
        <div class="column">
            <div class="column-title">🌍 行星图片</div>
            <div class="planet-card planet-image" data-planet="mercury">
                <img class="planet-img" src="" alt="水星">
            </div>
            <div class="planet-card planet-image" data-planet="venus">
                <img class="planet-img" src="" alt="金星">
            </div>
            <div class="planet-card planet-image" data-planet="earth">
                <img class="planet-img" src="" alt="地球">
            </div>
            <div class="planet-card planet-image" data-planet="mars">
                <img class="planet-img" src="" alt="火星">
            </div>
            <div class="planet-card planet-image" data-planet="jupiter">
                <img class="planet-img" src="" alt="木星">
            </div>
            <div class="planet-card planet-image" data-planet="saturn">
                <img class="planet-img" src="" alt="土星">
            </div>
            <div class="planet-card planet-image" data-planet="uranus">
                <img class="planet-img" src="" alt="天王星">
            </div>
            <div class="planet-card planet-image" data-planet="neptune">
                <img class="planet-img" src="" alt="海王星">
            </div>
        </div>

        <div class="column">
            <div class="column-title">📝 行星名称</div>
            <div class="planet-card planet-name" data-planet="earth">地球</div>
            <div class="planet-card planet-name" data-planet="mars">火星</div>
            <div class="planet-card planet-name" data-planet="mercury">水星</div>
            <div class="planet-card planet-name" data-planet="venus">金星</div>
            <div class="planet-card planet-name" data-planet="jupiter">木星</div>
            <div class="planet-card planet-name" data-planet="saturn">土星</div>
            <div class="planet-card planet-name" data-planet="uranus">天王星</div>
            <div class="planet-card planet-name" data-planet="neptune">海王星</div>
        </div>
    </div>

    <div class="message" id="message"></div>

    <div class="controls">
        <button class="btn btn-restart" onclick="restartGame()">🔄 重新开始</button>
        <button class="btn btn-answer" onclick="showAnswers()">🔍 查看答案</button>
    </div>

    <div class="edit-modal" id="editModal">
        <h2>🖼️ 更换行星图片</h2>
        <p style="color: #aaa; margin-bottom: 20px; text-align: center;">输入在线图片地址 或 上传本地图片</p>
        
        <div class="edit-item" data-planet="mercury">
            <label>💫 水星 (Mercury)</label>
            <input type="text" placeholder="输入图片 URL 地址" class="url-input">
            <input type="file" accept="image/*" class="file-input">
            <img class="preview" src="" alt="预览" style="display: none;">
        </div>
        
        <div class="edit-item" data-planet="venus">
            <label>🌕 金星 (Venus)</label>
            <input type="text" placeholder="输入图片 URL 地址" class="url-input">
            <input type="file" accept="image/*" class="file-input">
            <img class="preview" src="" alt="预览" style="display: none;">
        </div>
        
        <div class="edit-item" data-planet="earth">
            <label>🌍 地球 (Earth)</label>
            <input type="text" placeholder="输入图片 URL 地址" class="url-input">
            <input type="file" accept="image/*" class="file-input">
            <img class="preview" src="" alt="预览" style="display: none;">
        </div>
        
        <div class="edit-item" data-planet="mars">
            <label>🔴 火星 (Mars)</label>
            <input type="text" placeholder="输入图片 URL 地址" class="url-input">
            <input type="file" accept="image/*" class="file-input">
            <img class="preview" src="" alt="预览" style="display: none;">
        </div>
        
        <div class="edit-item" data-planet="jupiter">
            <label>🟤 木星 (Jupiter)</label>
            <input type="text" placeholder="输入图片 URL 地址" class="url-input">
            <input type="file" accept="image/*" class="file-input">
            <img class="preview" src="" alt="预览" style="display: none;">
        </div>
        
        <div class="edit-item" data-planet="saturn">
            <label>🪐 土星 (Saturn)</label>
            <input type="text" placeholder="输入图片 URL 地址" class="url-input">
            <input type="file" accept="image/*" class="file-input">
            <img class="preview" src="" alt="预览" style="display: none;">
        </div>
        
        <div class="edit-item" data-planet="uranus">
            <label>💠 天王星 (Uranus)</label>
            <input type="text" placeholder="输入图片 URL 地址" class="url-input">
            <input type="file" accept="image/*" class="file-input">
            <img class="preview" src="" alt="预览" style="display: none;">
        </div>
        
        <div class="edit-item" data-planet="neptune">
            <label>🔵 海王星 (Neptune)</label>
            <input type="text" placeholder="输入图片 URL 地址" class="url-input">
            <input type="file" accept="image/*" class="file-input">
            <img class="preview" src="" alt="预览" style="display: none;">
        </div>
        
        <div class="modal-buttons">
            <button class="btn btn-save" onclick="saveImages()">✅ 保存更改</button>
            <button class="btn btn-cancel" onclick="closeEditModal()">❌ 取消</button>
        </div>
    </div>

    <div class="victory" id="victory">
        <h2>🎉 恭喜通关！</h2>
        <p>你成功匹配了所有行星！</p>
        <p>总尝试次数: <span id="final-attempts">0</span></p>
        <button class="btn btn-restart" onclick="restartGame()">再玩一次</button>
    </div>

    <script>
        // 行星默认图片
        const defaultImages = {
            mercury: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23b5b5b5"/><circle cx="30" cy="35" r="8" fill="%239a9a9a"/><circle cx="60" cy="60" r="6" fill="%238a8a8a"/><circle cx="40" cy="70" r="5" fill="%237a7a7a"/></svg>',
            venus: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23e6c87a"/><circle cx="50" cy="20" r="10" fill="%23f0d078" opacity="0.5"/><circle cx="50" cy="80" r="12" fill="%23d4b068" opacity="0.5"/></svg>',
            earth: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%234a90d9"/><path d="M20 50 Q30 40 40 50 T60 50 T80 50" stroke="%232ecc71" stroke-width="8" fill="none"/><circle cx="70" cy="30" r="8" fill="%23ffffff" opacity="0.6"/></svg>',
            mars: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23c1440e"/><circle cx="35" cy="40" r="6" fill="%23a0380c"/><circle cx="65" cy="65" r="5" fill="%238a300a"/></svg>',
            jupiter: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23d4a373"/><ellipse cx="50" cy="30" rx="35" ry="8" fill="%23c49463" opacity="0.5"/><ellipse cx="50" cy="50" rx="38" ry="10" fill="%23b8845a" opacity="0.5"/><ellipse cx="50" cy="70" rx="35" ry="8" fill="%23c49463" opacity="0.5"/><ellipse cx="50" cy="25" rx="12" ry="8" fill="%238b4513" opacity="0.4"/></svg>',
            saturn: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="%23f4d03f"/><ellipse cx="50" cy="50" rx="55" ry="15" fill="none" stroke="%23d4ac0d" stroke-width="4" transform="rotate(-20 50 50)"/><ellipse cx="50" cy="50" rx="50" ry="12" fill="none" stroke="%23c9a227" stroke-width="3" transform="rotate(-20 50 50)"/></svg>',
            uranus: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%237de3f4"/><ellipse cx="50" cy="30" rx="30" ry="5" fill="%2366c9d6" opacity="0.4"/><ellipse cx="50" cy="70" rx="28" ry="5" fill="%2366c9d6" opacity="0.4"/><circle cx="50" cy="50" r="38" fill="none" stroke="%2355b8c9" stroke-width="2" opacity="0.3"/></svg>',
            neptune: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%234169e1"/><ellipse cx="50" cy="35" rx="32" ry="6" fill="%233357cc" opacity="0.4"/><ellipse cx="50" cy="65" rx="30" ry="6" fill="%233357cc" opacity="0.4"/><circle cx="35" cy="30" r="4" fill="%232b4db8" opacity="0.5"/></svg>'
        };

        let selectedPlanet = null;
        let selectedName = null;
        let score = 0;
        let attempts = 0;
        let matchedPairs = 0;
        const totalPairs = 8;

        const planetCards = document.querySelectorAll('.planet-card');
        const messageEl = document.getElementById('message');
        const scoreEl = document.getElementById('score');
        const attemptsEl = document.getElementById('attempts');
        const victoryEl = document.getElementById('victory');
        const finalAttemptsEl = document.getElementById('final-attempts');
        const editModal = document.getElementById('editModal');

        // 初始化图片
        function initImages() {
            const planetTypes = ['mercury', 'venus', 'earth', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune'];
            
            planetTypes.forEach(planet => {
                const img = document.querySelector(`.planet-card[data-planet="${planet}"] .planet-img`);
                if (img) {
                    // 直接加载默认图片
                    img.src = defaultImages[planet];
                }
            });

            // 图片加载完成后检查是否有自定义图片
            setTimeout(() => {
                planetTypes.forEach(planet => {
                    const savedImage = localStorage.getItem(`planet_${planet}`);
                    const img = document.querySelector(`.planet-card[data-planet="${planet}"] .planet-img`);
                    if (savedImage && img) {
                        try {
                            img.src = savedImage;
                        } catch (e) {
                            // 加载失败，使用默认图片
                            img.src = defaultImages[planet];
                        }
                    }
                });
            }, 100);
        }

        // 随机打乱 - 同步打乱两列
        function shuffleCards() {
            const imageColumn = document.querySelector('.column:first-child');
            const nameColumn = document.querySelector('.column:last-child');
            
            const imageCards = Array.from(imageColumn.querySelectorAll('.planet-card'));
            const nameCards = Array.from(nameColumn.querySelectorAll('.planet-card'));

            // 创建索引数组
            const indices = Array.from({length: totalPairs}, (_, i) => i);
            
            // 只打乱一次索引
            shuffleArray(indices);

            // 按照相同的索引顺序重新排列
            const shuffledImageCards = indices.map(i => imageCards[i]);
            const shuffledNameCards = indices.map(i => nameCards[i]);

            shuffledImageCards.forEach(card => imageColumn.appendChild(card));
            shuffledNameCards.forEach(card => nameColumn.appendChild(card));
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = `message show ${type}`;
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 2000);
        }

        function checkMatch() {
            if (!selectedPlanet || !selectedName) return;

            attempts++;
            attemptsEl.textContent = attempts;

            const planetType = selectedPlanet.dataset.planet;
            const nameType = selectedName.dataset.planet;

            if (planetType === nameType) {
                // 匹配成功
                selectedPlanet.classList.add('correct');
                selectedName.classList.add('correct');
                selectedPlanet.classList.remove('selected');
                selectedName.classList.remove('selected');
                
                score++;
                matchedPairs++;
                scoreEl.textContent = score;
                
                const planetNames = {
                    mercury: '水星',
                    venus: '金星',
                    earth: '地球',
                    mars: '火星',
                    jupiter: '木星',
                    saturn: '土星',
                    uranus: '天王星',
                    neptune: '海王星'
                };
                showMessage(`✅ 正确！这是${planetNames[planetType]}`, 'success');

                // 检查是否全部完成
                if (matchedPairs === totalPairs) {
                    setTimeout(() => {
                        finalAttemptsEl.textContent = attempts;
                        victoryEl.style.display = 'block';
                    }, 1000);
                }
            } else {
                // 匹配失败
                selectedPlanet.classList.add('wrong');
                selectedName.classList.add('wrong');
                
                showMessage('❌ 配对错误，请重试！', 'error');
                
                setTimeout(() => {
                    selectedPlanet.classList.remove('wrong', 'selected');
                    selectedName.classList.remove('wrong', 'selected');
                }, 500);
            }

            selectedPlanet = null;
            selectedName = null;
        }

        planetCards.forEach(card => {
            card.addEventListener('click', function() {
                if (this.classList.contains('correct')) return;

                const isPlanetImage = this.classList.contains('planet-image');
                
                if (isPlanetImage) {
                    // 点击的是行星图片
                    if (selectedPlanet) {
                        selectedPlanet.classList.remove('selected');
                    }
                    selectedPlanet = this;
                    this.classList.add('selected');
                    
                    if (selectedName) {
                        checkMatch();
                    }
                } else {
                    // 点击的是行星名称
                    if (selectedName) {
                        selectedName.classList.remove('selected');
                    }
                    selectedName = this;
                    this.classList.add('selected');
                    
                    if (selectedPlanet) {
                        checkMatch();
                    }
                }
            });
        });

        function restartGame() {
            selectedPlanet = null;
            selectedName = null;
            score = 0;
            attempts = 0;
            matchedPairs = 0;
            
            scoreEl.textContent = score;
            attemptsEl.textContent = attempts;
            victoryEl.style.display = 'none';
            
            planetCards.forEach(card => {
                card.classList.remove('selected', 'correct', 'wrong');
            });
            
            shuffleCards();
        }

        // 打开编辑模态框
        function openEditModal() {
            editModal.classList.add('show');
            
            // 填充当前图片预览
            const planetTypes = ['mercury', 'venus', 'earth', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune'];
            planetTypes.forEach(planet => {
                const editItem = document.querySelector(`.edit-item[data-planet="${planet}"]`);
                const img = editItem.querySelector('.planet-img');
                const currentSrc = document.querySelector(`.planet-card[data-planet="${planet}"] .planet-img`).src;
                const preview = editItem.querySelector('.preview');
                preview.src = currentSrc;
                preview.style.display = 'block';
            });
        }

        // 关闭编辑模态框
        function closeEditModal() {
            editModal.classList.remove('show');
            // 清空输入
            document.querySelectorAll('.url-input').forEach(input => input.value = '');
            document.querySelectorAll('.file-input').forEach(input => input.value = '');
        }

        // 保存图片更改
        function saveImages() {
            const editItems = document.querySelectorAll('.edit-item');
            let hasChanges = false;
            let allPromises = [];
            
            editItems.forEach(item => {
                const planet = item.dataset.planet;
                const urlInput = item.querySelector('.url-input');
                const fileInput = item.querySelector('.file-input');
                
                // 优先使用 URL 输入
                if (urlInput.value.trim()) {
                    try {
                        localStorage.setItem(`planet_${planet}`, urlInput.value.trim());
                        // 立即更新页面显示
                        const planetImg = document.querySelector(`.planet-card[data-planet="${planet}"] .planet-img`);
                        planetImg.src = urlInput.value.trim();
                        hasChanges = true;
                    } catch (e) {
                        console.error('保存URL图片失败:', e);
                    }
                } 
                // 其次使用文件上传
                else if (fileInput.files[0]) {
                    try {
                        // 创建Promise来处理异步的文件读取
                        const promise = new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = function(e) {
                                try {
                                    localStorage.setItem(`planet_${planet}`, e.target.result);
                                    // 更新页面显示
                                    const planetImg = document.querySelector(`.planet-card[data-planet="${planet}"] .planet-img`);
                                    planetImg.src = e.target.result;
                                    resolve();
                                } catch (e) {
                                    console.error('保存本地图片失败:', e);
                                    reject(new Error('图片文件太大，无法保存'));
                                }
                            };
                            reader.onerror = function(e) {
                                reject(new Error('读取图片文件失败'));
                            };
                            reader.readAsDataURL(fileInput.files[0]);
                        });
                        allPromises.push(promise);
                        hasChanges = true;
                    } catch (e) {
                        console.error('处理文件失败:', e);
                    }
                }
            });
            
            // 等待所有异步操作完成
            Promise.all(allPromises)
                .then(() => {
                    closeEditModal();
                    if (hasChanges) {
                        showMessage('✅ 图片更新成功！', 'success');
                    } else {
                        showMessage('ℹ️ 没有更改任何图片', 'info');
                    }
                })
                .catch((error) => {
                    closeEditModal();
                    showMessage(`❌ ${error.message}`, 'error');
                });
        }

        // URL 输入框实时预览
        document.querySelectorAll('.url-input').forEach(input => {
            input.addEventListener('input', function() {
                const editItem = this.closest('.edit-item');
                const preview = editItem.querySelector('.preview');
                
                if (this.value.trim()) {
                    preview.src = this.value.trim();
                } else {
                    const planet = editItem.dataset.planet;
                    preview.src = document.querySelector(`.planet-card[data-planet="${planet}"] .planet-img`).src;
                }
            });
        });

        // 文件选择实时预览
        document.querySelectorAll('.file-input').forEach(input => {
            input.addEventListener('change', function() {
                const editItem = this.closest('.edit-item');
                const preview = editItem.querySelector('.preview');
                
                if (this.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        preview.src = e.target.result;
                    };
                    reader.readAsDataURL(this.files[0]);
                }
            });
        });

        // 初始化游戏
        initImages();
        shuffleCards();

        // 查看答案功能
        function showAnswers() {
            // 移除之前的提示样式
            document.querySelectorAll('.planet-card').forEach(card => {
                card.classList.remove('hint', 'mercury', 'venus', 'earth', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune');
            });

            // 为所有卡片添加提示效果，每个行星配对不同颜色
            const imageCards = document.querySelectorAll('.planet-card.planet-image');
            const nameCards = document.querySelectorAll('.planet-card.planet-name');

            const planetColors = ['mercury', 'venus', 'earth', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune'];

            imageCards.forEach(imgCard => {
                const planet = imgCard.dataset.planet;
                // 找到对应的名称卡片
                const matchingNameCard = Array.from(nameCards).find(card => card.dataset.planet === planet);
                
                if (matchingNameCard && !matchingNameCard.classList.contains('correct')) {
                    // 为配对的卡片添加对应的颜色类
                    imgCard.classList.add('hint', planet);
                    matchingNameCard.classList.add('hint', planet);
                }
            });

            showMessage('💡 相同颜色的卡片是对应的！', 'info');

            // 5秒后自动移除提示
            setTimeout(() => {
                document.querySelectorAll('.planet-card').forEach(card => {
                    card.classList.remove('hint', 'mercury', 'venus', 'earth', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune');
                });
            }, 5000);
        }
    </script>
</body>
