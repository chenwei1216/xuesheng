<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行星知识转盘问答</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0c1445, #1a237e);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            padding: 20px;
        }

        .game-container {
            max-width: 1000px;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            margin-top: 20px;
        }

        h1 {
            text-align: center;
            color: #00d4ff;
            text-shadow: 0 0 10px #00d4ff;
            margin-bottom: 20px;
        }

        .instructions {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.5;
        }

        /* 转盘样式 */
        .wheel-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            position: relative;
            width: 300px;
            margin-left: auto;
            margin-right: auto;
        }

        .wheel {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: conic-gradient(
                #1565c0 0deg 72deg,   /* 基础题 */
                #0d47a1 72deg 144deg,  /* 进阶题 */
                #1976d2 144deg 216deg, /* 挑战题 */
                #2196f3 216deg 288deg, /* 趣味题 */
                #42a5f5 288deg 360deg  /* 科普题 */
            );
            position: relative;
            transition: transform 3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .wheel::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            background: #ffeb3b;
            border-radius: 50%;
            z-index: 2;
            box-shadow: 0 0 10px #ffeb3b;
        }

        .wheel-marker {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 40px solid #ff5722;
            z-index: 1;
            pointer-events: none;
        }

        .wheel-segment {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px black;
        }

        .segment-1 { transform: rotate(36deg); }   /* 基础题 中心角度 */
        .segment-2 { transform: rotate(108deg); }  /* 进阶题 中心角度 */
        .segment-3 { transform: rotate(180deg); }  /* 挑战题 中心角度 */
        .segment-4 { transform: rotate(252deg); }  /* 趣味题 中心角度 */
        .segment-5 { transform: rotate(324deg); }  /* 科普题 中心角度 */

        /* 问答区域样式 */
        .quiz-container {
            background: rgba(25, 118, 210, 0.2);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: none; /* 默认隐藏 */
        }

        .question {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: #ffeb3b;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            padding: 15px;
            border: 2px solid #00d4ff;
            border-radius: 8px;
            background: rgba(15, 66, 135, 0.5);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .option-btn:hover {
            background: rgba(0, 212, 255, 0.3);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: #4caf50;
            border-color: #4caf50;
        }

        .option-btn.incorrect {
            background: #f44336;
            border-color: #f44336;
        }

        /* 控制区域 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #00d4ff;
            color: #0c1445;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #00a8cc;
            transform: translateY(-2px);
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .score {
            background: rgba(255, 235, 59, 0.2);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #ffeb3b;
        }

        #feedback {
            height: 30px;
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            color: #ffeb3b;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .wheel-container {
                width: 250px;
            }
            .wheel {
                width: 250px;
                height: 250px;
            }
            
            .options {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>行星知识转盘问答</h1>
        
        <div class="instructions">
            <strong>游戏规则：</strong>点击"转动转盘"按钮，转盘停止后会随机出现一道行星知识选择题，选择正确答案即可得分！<br>
            每次答题后可再次转动转盘挑战新题目，看看你能得多少分！
        </div>

        <!-- 转盘区域 -->
        <div class="wheel-container">
            <div class="wheel" id="wheel">
                <div class="wheel-segment segment-1">基础题</div>
                <div class="wheel-segment segment-2">进阶题</div>
                <div class="wheel-segment segment-3">挑战题</div>
                <div class="wheel-segment segment-4">趣味题</div>
                <div class="wheel-segment segment-5">科普题</div>
            </div>
            <div class="wheel-marker"></div>
        </div>

        <!-- 问答区域 -->
        <div class="quiz-container" id="quiz-container">
            <div class="question" id="question"></div>
            <div class="options" id="options"></div>
        </div>

        <div id="feedback"></div>

        <!-- 控制区域 -->
        <div class="controls">
            <button id="spin-btn">转动转盘</button>
            <div class="score">得分：<span id="score">0</span></div>
        </div>
    </div>

    <script>
        // 等待DOM完全加载后再执行
        document.addEventListener('DOMContentLoaded', function() {
            // 大幅扩充后的问答题库 - 按难度分类，总计40道题目
            const quizQuestions = {
                基础题: [
                    { question: "地球的天然卫星是？", options: ["金星", "月球", "火星", "水星"], answer: 1 },
                    { question: "太阳系中最大的行星是？", options: ["木星", "土星", "地球", "天王星"], answer: 0 },
                    { question: "被称为红色星球的是？", options: ["金星", "火星", "木星", "水星"], answer: 1 },
                    { question: "地球属于什么类型的行星？", options: ["气态行星", "岩石行星", "冰巨星", "矮行星"], answer: 1 },
                    { question: "月球绕地球公转的方向是？", options: ["自东向西", "自西向东", "随机方向", "南北方向"], answer: 1 },
                    { question: "太阳系中离地球最近的行星是？", options: ["火星", "金星", "水星", "木星"], answer: 1 },
                    { question: "地球的公转轨道形状是？", options: ["正圆形", "椭圆形", "方形", "三角形"], answer: 1 },
                    { question: "我们常说的“启明星”指的是哪颗行星？", options: ["水星", "金星", "火星", "木星"], answer: 1 }
                ],
                进阶题: [
                    { question: "距离太阳最近的行星是？", options: ["金星", "水星", "地球", "火星"], answer: 1 },
                    { question: "拥有明显行星环的行星是？", options: ["木星", "土星", "天王星", "海王星"], answer: 1 },
                    { question: "太阳系中最热的行星是？", options: ["水星", "金星", "火星", "木星"], answer: 1 },
                    { question: "土星的行星环主要由什么构成？", options: ["岩石", "冰粒和尘埃", "金属", "气体"], answer: 1 },
                    { question: "木星的标志性特征是？", options: ["大红斑", "行星环", "极昼极夜", "液态水"], answer: 0 },
                    { question: "海王星的颜色主要是？", options: ["红色", "蓝色", "黄色", "绿色"], answer: 1 },
                    { question: "天王星的自转方向是？", options: ["顺时针", "逆时针", "横躺旋转", "无固定方向"], answer: 2 },
                    { question: "太阳系中质量第二大的行星是？", options: ["土星", "木星", "天王星", "海王星"], answer: 0 }
                ],
                挑战题: [
                    { question: "自转轴几乎与公转平面平行的行星是？", options: ["木星", "土星", "天王星", "海王星"], answer: 2 },
                    { question: "密度比水还小的行星是？", options: ["土星", "木星", "天王星", "海王星"], answer: 0 },
                    { question: "拥有超过95颗已知卫星的行星是？", options: ["土星", "木星", "天王星", "地球"], answer: 1 },
                    { question: "火星上最高的火山是？", options: ["富士山", "奥林匹斯山", "珠穆朗玛峰", "乞力马扎罗山"], answer: 1 },
                    { question: "水星的昼夜温差大约是多少？", options: ["100℃", "300℃", "600℃", "1000℃"], answer: 2 },
                    { question: "金星的一天（自转周期）比一年（公转周期）？", options: ["短", "长", "一样长", "不确定"], answer: 1 },
                    { question: "冥王星被降级为矮行星的年份是？", options: ["2000年", "2006年", "2012年", "2018年"], answer: 1 },
                    { question: "太阳系中逃逸速度最大的行星是？", options: ["木星", "地球", "土星", "太阳"], answer: 0 }
                ],
                趣味题: [
                    { question: "被称为启明星的行星是？", options: ["水星", "金星", "火星", "木星"], answer: 1 },
                    { question: "太阳系中唯一拥有生命的行星是？", options: ["地球", "火星", "金星", "木星"], answer: 0 },
                    { question: "冥王星被归类为？", options: ["行星", "矮行星", "卫星", "小行星"], answer: 1 },
                    { question: "哪个行星的一天只有9小时55分钟？", options: ["木星", "土星", "天王星", "海王星"], answer: 0 },
                    { question: "“蓝色星球”通常指的是？", options: ["地球", "海王星", "天王星", "土星"], answer: 0 },
                    { question: "火星上的“水手谷”是什么地貌？", options: ["火山口", "大峡谷", "平原", "陨石坑"], answer: 1 },
                    { question: "哪个行星被称为“躺着旋转的行星”？", options: ["土星", "天王星", "海王星", "木星"], answer: 1 },
                    { question: "月球上的“环形山”主要由什么形成？", options: ["火山喷发", "陨石撞击", "板块运动", "水流侵蚀"], answer: 1 }
                ],
                科普题: [
                    { question: "地球公转一周的时间大约是？", options: ["1天", "1月", "1年", "10年"], answer: 2 },
                    { question: "月球绕地球一周的时间大约是？", options: ["7天", "15天", "28天", "365天"], answer: 2 },
                    { question: "太阳系中有多少颗行星？", options: ["8", "9", "10", "12"], answer: 0 },
                    { question: "光年是什么单位？", options: ["时间单位", "长度单位", "质量单位", "速度单位"], answer: 1 },
                    { question: "太阳的主要成分是？", options: ["氢和氦", "氧和氮", "碳和铁", "水和甲烷"], answer: 0 },
                    { question: "地球的自转周期大约是？", options: ["12小时", "24小时", "30天", "365天"], answer: 1 },
                    { question: "小行星带位于哪两个行星之间？", options: ["地球和火星", "火星和木星", "木星和土星", "土星和天王星"], answer: 1 },
                    { question: "日食发生时，哪个天体位于中间？", options: ["地球", "月球", "太阳", "火星"], answer: 1 }
                ]
            };

            // 记录已出过的题目，避免重复
            const usedQuestions = {
                基础题: [],
                进阶题: [],
                挑战题: [],
                趣味题: [],
                科普题: []
            };

            // 转盘区域对应的角度范围和题目类型（精确匹配）
            const wheelSegments = [
                { min: 0, max: 72, type: "基础题", score: 10 },
                { min: 72, max: 144, type: "进阶题", score: 20 },
                { min: 144, max: 216, type: "挑战题", score: 30 },
                { min: 216, max: 288, type: "趣味题", score: 15 },
                { min: 288, max: 360, type: "科普题", score: 25 }
            ];

            // DOM元素（确保能正确获取）
            const wheel = document.getElementById('wheel');
            const spinBtn = document.getElementById('spin-btn');
            const quizContainer = document.getElementById('quiz-container');
            const questionElement = document.getElementById('question');
            const optionsElement = document.getElementById('options');
            const feedbackElement = document.getElementById('feedback');
            const scoreElement = document.getElementById('score');

            // 游戏状态
            let score = 0;
            let isSpinning = false;
            let currentQuestion = null;
            let currentScoreValue = 0;

            // 随机生成转盘停止的角度（360-1800度，即1-5圈）
            function getRandomSpinAngle() {
                return Math.floor(Math.random() * 1440) + 360;
            }

            // 精准的角度匹配逻辑
            function getSegmentType(angle) {
                const normalizedAngle = angle % 360; // 归一化到0-360度
                // 遍历所有分段，找到匹配的
                for (let i = 0; i < wheelSegments.length; i++) {
                    const segment = wheelSegments[i];
                    if (normalizedAngle >= segment.min && normalizedAngle < segment.max) {
                        return segment;
                    }
                }
                // 兜底返回基础题
                return wheelSegments[0];
            }

            // 随机出题（避免重复）
            function getRandomQuestion(type) {
                const questions = quizQuestions[type];
                // 筛选未出过的题目
                const unused = questions.filter((_, idx) => !usedQuestions[type].includes(idx));
                
                // 全部出过则重置
                if (unused.length === 0) {
                    usedQuestions[type] = [];
                    feedbackElement.textContent = "⚠️ 该类型题目已答完，重置题目池！";
                    return getRandomQuestion(type);
                }
                
                // 随机选一个未出的题目
                const randomIdx = Math.floor(Math.random() * unused.length);
                const realIdx = questions.indexOf(unused[randomIdx]);
                usedQuestions[type].push(realIdx);
                return unused[randomIdx];
            }

            // 显示题目（核心修复：确保能正确显示）
            function showQuestion(segment) {
                currentScoreValue = segment.score;
                currentQuestion = getRandomQuestion(segment.type);
                
                // 更新问题文本
                questionElement.textContent = currentQuestion.question;
                
                // 清空选项并重新生成
                optionsElement.innerHTML = '';
                currentQuestion.options.forEach((option, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = option;
                    btn.dataset.index = index;
                    // 绑定答题事件
                    btn.onclick = checkAnswer;
                    optionsElement.appendChild(btn);
                });
                
                // 强制显示问答区域
                quizContainer.style.display = 'block';
                // 清除非重置提示的反馈
                if (feedbackElement.textContent !== "⚠️ 该类型题目已答完，重置题目池！") {
                    feedbackElement.textContent = `抽到${segment.type}，分值${segment.score}分`;
                }
            }

            // 检查答案（修复得分更新）
            function checkAnswer(e) {
                const selectedIdx = parseInt(e.target.dataset.index);
                const allOptions = document.querySelectorAll('.option-btn');
                
                // 禁用所有选项
                allOptions.forEach(btn => {
                    btn.disabled = true;
                    btn.onclick = null; // 移除事件
                });

                // 判断答案
                if (selectedIdx === currentQuestion.answer) {
                    // 正确
                    e.target.classList.add('correct');
                    score += currentScoreValue;
                    scoreElement.textContent = score; // 强制更新得分
                    feedbackElement.textContent = `回答正确！+${currentScoreValue}分 🎉`;
                    feedbackElement.style.color = '#4caf50';
                } else {
                    // 错误
                    e.target.classList.add('incorrect');
                    allOptions[currentQuestion.answer].classList.add('correct');
                    feedbackElement.textContent = `回答错误！正确答案：${currentQuestion.options[currentQuestion.answer]} ❌`;
                    feedbackElement.style.color = '#f44336';
                }

                // 重新启用转盘按钮
                spinBtn.disabled = false;
                spinBtn.textContent = '再次转动转盘';
            }

            // 转动转盘（核心逻辑）
            function spinWheel() {
                if (isSpinning) return;
                
                // 状态重置
                isSpinning = true;
                spinBtn.disabled = true;
                spinBtn.textContent = '转盘转动中...';
                quizContainer.style.display = 'none';
                feedbackElement.textContent = '转盘转动中...';
                
                // 随机角度
                const spinAngle = getRandomSpinAngle();
                
                // 执行旋转动画
                wheel.style.transform = `rotate(${spinAngle}deg)`;
                
                // 3秒后停止并显示题目
                setTimeout(() => {
                    isSpinning = false;
                    const segment = getSegmentType(spinAngle);
                    feedbackElement.textContent = `转盘停止！抽到${segment.type}`;
                    // 强制触发题目显示
                    showQuestion(segment);
                    // 恢复按钮文字
                    spinBtn.textContent = '转动转盘';
                }, 3000);
            }

            // 绑定转盘按钮事件（确保绑定成功）
            spinBtn.addEventListener('click', spinWheel);

            // 初始化得分显示
            scoreElement.textContent = score;
        });
    </script>
</body>
</html>
